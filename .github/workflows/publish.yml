name: publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC for npm trusted publishing - no stored secrets
      contents: write   # create the GitHub Release for the tag
    steps:
      # No fetch-tags here: on a tag-push event checkout already fetches the
      # triggering tag ref (fetch-tags would fetch the same refspec twice and
      # fail with "Cannot fetch both ... to refs/tags/<tag>").
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: update npm (trusted publishing needs a recent npm)
        run: npm install -g npm@latest
      - name: tag must match package.json version
        run: node -e "const v='v'+require('./package.json').version; if (v !== process.env.GITHUB_REF_NAME) { console.error(`tag ${process.env.GITHUB_REF_NAME} != package ${v}`); process.exit(1) }"
      - name: gate on selftest
        run: node scripts/selftest.js
      - name: publish (OIDC, provenance automatic)
        run: npm publish --access public
      - name: github release (notes from the annotated tag, generated as fallback)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # checkout peels the tag ref to a commit, so %(contents) would read
          # the commit message; re-fetch the real tag object first.
          git fetch origin --no-tags -f "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = "tag" ] && [ -n "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" --title "lamarck $GITHUB_REF_NAME" --notes "$notes" --latest
          else
            gh release create "$GITHUB_REF_NAME" --title "lamarck $GITHUB_REF_NAME" --generate-notes --latest
          fi
